{% extends "layouts/base.html" %}

{% block title %}Acceso administración &mdash; ParkMed{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="bg-white rounded shadow-sm p-4 border border-dark border-2">
            <div class="text-center mb-3">
                <i class="bi bi-gear-fill display-5 text-dark"></i>
            </div>
            <h1 class="h3 fw-bold text-center mb-1">Administración</h1>
            <p class="text-muted small text-center mb-4">
                Acceso exclusivo para administradores del sistema.
            </p>

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="rut" class="form-label">RUT</label>
                    <input type="text" name="rut" id="rut" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
