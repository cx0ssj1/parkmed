{% extends "layouts/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Acceso policía &mdash; ParkMed{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="bg-white rounded shadow-sm p-4 border border-warning border-2">
            <div class="text-center mb-3">
                <i class="bi bi-shield-fill-check display-5 text-warning"></i>
            </div>
            <h1 class="h3 fw-bold text-center mb-1">Acceso policía</h1>
            <p class="text-muted small text-center mb-4">
                Solo Carabineros y Policía Municipal autorizados.
            </p>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-warning w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <hr class="my-4">

            <p class="text-center small text-muted mb-0">
                ¿Eres paciente?
                <a href="{% url 'usuarios:login' %}">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
